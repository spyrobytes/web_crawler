[package]
name = "web_crawler_blackhat"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.7", features = ["cargo"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
anyhow = "1.0"
thiserror = "2.0.21"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11.11"
select = "0.6.0"
url = "2.2"
futures = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"
fantoccini = { version = "0.22.1", default-features = false, features = ["rustls-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1"

[[bin]]
name = "web_crawler_blackhat"
path = "src/main.rs"

[dev-dependencies]
wiremock = "0.6"
